<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
        name="description"
        content="Painel administrativo Sonora."
    />

    <title>Sonora — Painel Administrativo</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    />

    <!-- CSS global -->
    <link rel="stylesheet" href="assets/css/dashboard.css" />

    <!-- CSS específico da página -->
    <!--
    <link rel="stylesheet" href="assets/css/cursos.css" />
    -->
</head>

<body>

    <div class="app">

        <!-- =========================================
             SIDEBAR
        ========================================== -->

        <aside class="sidebar">

            <a class="brand" href="cursos.html">
                <span>S</span>
                sonora
            </a>

            <p class="workspace">
                GESTÃO ACADÊMICA
            </p>

            <nav aria-label="Navegação principal">

                <a
                    class="nav-item"
                    href="cursos.html"
                    data-page="cursos"
                >
                    <i>▣</i>
                    <span>Cursos</span>
                </a>

                <a
                    class="nav-item"
                    href="clientes.html"
                    data-page="clientes"
                >
                    <i>♙</i>
                    <span>Clientes</span>
                </a>

                <a
                    class="nav-item"
                    href="professores.html"
                    data-page="professores"
                >
                    <i>♧</i>
                    <span>Professores</span>
                </a>

                <a
                    class="nav-item"
                    href="instrumentos.html"
                    data-page="instrumentos"
                >
                    <i>♬</i>
                    <span>Instrumentos</span>
                </a>

                <a
                    class="nav-item"
                    href="aulas.html"
                    data-page="aulas"
                >
                    <i>□</i>
                    <span>Aulas</span>
                </a>

            </nav>


            <!-- ADMINISTRADOR -->

            <button
                class="admin"
                type="button"
                id="admin-button"
            >

                <span class="admin-avatar">
                    AC
                </span>

                <span class="admin-info">
                    <strong>Andrea Castro</strong>
                    <small>Administradora</small>
                </span>

                <b class="admin-arrow">
                    ⌄
                </b>

            </button>


            <!-- MENU DO ADMIN -->

            <div
                class="admin-menu"
                id="admin-menu"
                hidden
            >

                <button type="button">
                    Meu perfil
                </button>

                <button type="button">
                    Configurações
                </button>

                <button
                    type="button"
                    id="logout-button"
                >
                    Sair
                </button>

            </div>


            <div class="side-orb"></div>

        </aside>


        <!-- =========================================
             CONTEÚDO PRINCIPAL
        ========================================== -->

        <main class="content">

            <!-- TOPBAR -->

            <header class="topbar">

                <div>

                    <p class="eyebrow">
                        PAINEL ADMINISTRATIVO
                    </p>

                    <h1 id="page-title">
                        Cursos
                    </h1>

                </div>


                <div class="top-actions">

                    <button
                        class="search"
                        type="button"
                        aria-label="Pesquisar"
                        id="search-button"
                    >
                        ⌕
                    </button>


                    <button
                        class="bell"
                        type="button"
                        aria-label="Notificações"
                        id="notification-button"
                    >

                        ♧

                        <i></i>

                    </button>

                </div>

            </header>


            <!--
                O conteúdo específico de cada página
                ficará aqui.
            -->

            <section class="page-content">

                <!--
                    CURSOS
                    CLIENTES
                    PROFESSORES
                    INSTRUMENTOS
                    AULAS

                    entram aqui.
                -->

            </section>


            <!-- TOAST GLOBAL -->

            <p
                class="toast"
                id="toast"
                aria-live="polite"
            ></p>

        </main>

    </div>


    <!-- JS GLOBAL -->

    <script src="assets/js/dashboard.js"></script>

    <!-- JS específico da página -->
    <!--
    <script src="assets/js/cursos.js"></script>
    -->

</body>
</html>
